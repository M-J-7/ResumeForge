name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    # Every Prisma CLI call resolves `env("DATABASE_URL")` when
    # `prisma.config.ts` loads, whether or not it connects — so `db:generate`
    # needs it, and so does `pnpm verify`, whose `pretypecheck` hook generates
    # again. Locally a `.env` supplies it; that file is gitignored, so on CI
    # nothing does and the command fails before it reads the schema.
    #
    # Job-level rather than per-step because two different steps need it. The
    # tests are unaffected: db.test.ts deletes and restores this variable
    # itself, and migrate.test.ts passes its own to the child process.
    env:
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fonts are vendored in the repo but copied into public/ by a script;
      # the emitter tests read them from src/, so this is only needed for the
      # build. Run it anyway so a failure here is loud rather than latent.
      - run: pnpm fonts:sync
      # The Prisma client is generated, not committed; typecheck fails without it.
      - run: pnpm db:generate
      - run: pnpm verify

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Only for the `db:generate` step below. Playwright sets its own
    # DATABASE_URL for the server it spawns (`playwright.config.ts`), pointing
    # at a separate file so a test run never writes to the database anything
    # else is using — this value must not be the one the suite runs against.
    env:
      DATABASE_URL: "file:./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      # Covers the worker, canvas rasterization, and IndexedDB — none of
      # which the Node suite can exercise. pdfjs in particular behaves
      # differently under Node, so this is the only place browser-only
      # regressions surface.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The deploy target cannot build the application it runs.
  #
  # Always Free A1 capacity was unobtainable in ap-hyderabad-1 on 2026-09-12, so
  # the deployment fell back to the other Always Free shape: VM.Standard.E2.1
  # .Micro, an eighth of an OCPU and 1 GB of memory. It runs the standalone
  # server comfortably — a few hundred megabytes, with PDF rendering happening
  # in the browser — but `next build` on that machine is not a slow build, it is
  # a failed one.
  #
  # So the image is built here, where a runner has cores and memory, and the
  # instance only pulls it. `deploy/oracle/bootstrap.sh` pulls instead of
  # building whenever APP_IMAGE is set.
  #
  # amd64 only, deliberately. The E2 micro is x86_64, and adding linux/arm64
  # here would put a twenty-minute QEMU build on the path of every push to
  # master for an architecture nothing is currently deployed on. The
  # `docker-arm64` job below still proves arm64 compiles; add the platform here
  # on the day this moves to A1.
  publish:
    name: Publish the runtime image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A Docker reference must be lowercase and the repository is not
      # ("M-J-7/ResumeForge"), so pushing ${{ github.repository }} verbatim
      # fails on an invalid reference. `${VAR,,}` lowercases it.
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Both tags on purpose: `latest` is what the instance pulls, and the
          # sha tag is what makes a rollback nameable rather than a rebuild.
          tags: |
            ${{ steps.image.outputs.ref }}:latest
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The deploy target is an Oracle Ampere A1, which is arm64, and the two
  # things this image builds from source — better-sqlite3's native binding and
  # the Next standalone output — are exactly the kind that build on one
  # architecture and not the other. Finding that out on the instance means
  # finding it out after provisioning, DNS and TLS, which is the worst place.
  #
  # Kept off pull requests deliberately. Under QEMU this takes about twenty
  # minutes, and paying that on every PR to verify a target that only changes
  # when the Dockerfile does would make the fast checks above useless. Master
  # is where a deploy is cut from, so master is where it has to hold.
  docker-arm64:
    name: Docker image builds for arm64 (the deploy target)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
